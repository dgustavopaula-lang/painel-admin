<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carregando...</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<style>
  :root { --cor: #e8590c; --cor-texto: #fff; --fundo: #121212; --card: #1e1e1e; --texto: #f1f1f1; --suave: #a8a8a8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); line-height: 1.5; padding-bottom: 90px; }
  header { background: var(--cor); color: var(--cor-texto); padding: 32px 20px 28px; text-align: center; }
  header .tipo { font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  header h1 { font-size: 2rem; line-height: 1.15; margin: 6px 0 8px; }
  header p { opacity: .95; }
  .status { display: inline-block; margin-top: 14px; padding: 5px 14px; border-radius: 999px; font-size: .9rem; font-weight: 600; background: rgba(0,0,0,.25); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  h2 { font-size: 1.2rem; margin: 26px 0 12px; }
  .itens { display: grid; gap: 10px; }
  .item { background: var(--card); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .item .info { flex: 1; }
  .item .nome { font-weight: 600; }
  .item .desc { color: var(--suave); font-size: .9rem; }
  .item .preco { font-weight: 700; color: var(--cor); white-space: nowrap; }
  .qtd { display: flex; align-items: center; gap: 8px; }
  .qtd button { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--cor); color: var(--cor-texto); font-size: 1.2rem; font-weight: 700; cursor: pointer; }
  .qtd span { min-width: 18px; text-align: center; font-weight: 700; }
  .bloco { background: var(--card); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
  .bloco a { color: var(--cor); font-weight: 600; text-decoration: none; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: rgba(18,18,18,.96); border-top: 1px solid #2a2a2a; }
  .barra a { display: block; max-width: 760px; margin: 0 auto; text-align: center; background: #25d366; color: #fff; font-weight: 700; font-size: 1.05rem; padding: 14px; border-radius: 12px; text-decoration: none; }
  footer { text-align: center; color: var(--suave); font-size: .8rem; margin-top: 30px; }
  footer a { color: var(--suave); }
</style>
</head>
<body>

<header>
  <div class="tipo" id="tipo"></div>
  <h1 id="nome"></h1>
  <p id="destaque"></p>
  <div class="status" id="status"></div>
</header>

<main>
  <h2 id="tituloItens"></h2>
  <div class="itens" id="itens"></div>

  <h2>Onde estamos</h2>
  <div class="bloco" id="contato"></div>

  <footer>
    © <span id="ano"></span> <span id="rodapeNome"></span> · Site por <a href="https://gustavopaulasantos.com.br" target="_blank" rel="noopener">GPS.dev</a>
  </footer>
</main>

<div class="barra"><a id="botaoWhats" target="_blank" rel="noopener"></a></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO CLIENTE — troque SÓ este bloco para cada comércio.
   ===================================================================== */
const CONFIG = {
  nome: "Borracharia do Zé",
  tipo: "Borracharia",                 // Lanchonete, Depósito de Gás, Bar, Barbearia...
  destaque: "Atendimento rápido, perto de você.",
  whatsapp: "5562999999999",           // 55 + DDD + número, só dígitos
  endereco: "Rua das Flores, 120 - Centro, Cidade/GO",
  mapa: "",                            // link do Google Maps (vazio = busca pelo endereço)
  instagram: "",                       // ex.: "borrachariadoze" (sem @)
  cor: "#e8590c",                      // cor principal
  corTexto: "#ffffff",

  // Horário: dia da semana (0 = domingo ... 6 = sábado) → [abre, fecha]. Vazio = fechado.
  horario: {
    0: [],
    1: ["07:00", "18:00"], 2: ["07:00", "18:00"], 3: ["07:00", "18:00"],
    4: ["07:00", "18:00"], 5: ["07:00", "18:00"], 6: ["07:00", "12:00"]
  },
  horarioTexto: "Seg a Sex 7h–18h · Sáb 7h–12h",

  // modo "lista":  só mostra serviços/preços; o botão chama no WhatsApp.
  // modo "pedido": cada item tem + e −, e o botão envia o pedido montado.
  modo: "lista",
  tituloItens: "Serviços e preços",

  itens: [
    { nome: "Remendo de pneu (carro)", preco: 30, desc: "" },
    { nome: "Calibragem", preco: 5, desc: "" },
    { nome: "Troca de pneu", preco: 40, desc: "Mão de obra" }
  ]
};
/* ===================== FIM DA CONFIGURAÇÃO ===================== */

/* --- Exemplos prontos para copiar no lugar de "itens" e "modo" ---
Lanchonete  (modo: "pedido", tituloItens: "Cardápio"):
  { nome: "X-Burguer", preco: 18, desc: "Pão, carne, queijo e salada" },
  { nome: "Coxinha", preco: 7, desc: "" },
  { nome: "Refrigerante lata", preco: 6, desc: "" }
Depósito de Gás  (modo: "pedido", tituloItens: "Produtos"):
  { nome: "Botijão P13", preco: 120, desc: "Entrega no bairro" },
  { nome: "Galão de água 20L", preco: 15, desc: "" }
Bar da Rodoviária  (modo: "pedido", tituloItens: "Cardápio"):
  { nome: "Café", preco: 4, desc: "" },
  { nome: "Pão de queijo", preco: 5, desc: "" },
  { nome: "Prato feito", preco: 25, desc: "Almoço" }
*/

const $ = (id) => document.getElementById(id);
const real = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const qtd = CONFIG.itens.map(() => 0);

document.documentElement.style.setProperty("--cor", CONFIG.cor);
document.documentElement.style.setProperty("--cor-texto", CONFIG.corTexto);
document.title = `${CONFIG.nome} · ${CONFIG.tipo}`;
document.querySelector('meta[name="description"]').content = `${CONFIG.tipo} em ${CONFIG.endereco}. ${CONFIG.destaque}`;
$("tipo").textContent = CONFIG.tipo;
$("nome").textContent = CONFIG.nome;
$("destaque").textContent = CONFIG.destaque;
$("tituloItens").textContent = CONFIG.tituloItens;
$("rodapeNome").textContent = CONFIG.nome;
$("ano").textContent = new Date().getFullYear();

function abertoAgora() {
  const agora = new Date();
  const h = CONFIG.horario[agora.getDay()] || [];
  if (h.length !== 2) return false;
  const min = agora.getHours() * 60 + agora.getMinutes();
  const [a, f] = h.map((t) => { const [hh, mm] = t.split(":").map(Number); return hh * 60 + mm; });
  return min >= a && min < f;
}
$("status").textContent = abertoAgora() ? "● Aberto agora" : "● Fechado agora";

function renderItens() {
  $("itens").innerHTML = CONFIG.itens.map((it, i) => `
    <div class="item">
      <div class="info">
        <div class="nome">${esc(it.nome)}</div>
        ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ""}
        <div class="preco">${real(it.preco)}</div>
      </div>
      ${CONFIG.modo === "pedido" ? `
      <div class="qtd">
        <button aria-label="Remover" onclick="mudar(${i},-1)">−</button>
        <span>${qtd[i]}</span>
        <button aria-label="Adicionar" onclick="mudar(${i},1)">+</button>
      </div>` : ""}
    </div>`).join("");
  atualizarBotao();
}

function mudar(i, d) { qtd[i] = Math.max(0, qtd[i] + d); renderItens(); }

function atualizarBotao() {
  const escolhidos = CONFIG.itens.map((it, i) => ({ ...it, q: qtd[i] })).filter((it) => it.q > 0);
  let texto, rotulo;
  if (CONFIG.modo === "pedido" && escolhidos.length) {
    const total = escolhidos.reduce((s, it) => s + it.q * it.preco, 0);
    texto = `Olá, ${CONFIG.nome}! Quero fazer um pedido:\n` +
      escolhidos.map((it) => `• ${it.q}x ${it.nome} — ${real(it.q * it.preco)}`).join("\n") +
      `\nTotal: ${real(total)}`;
    rotulo = `Enviar pedido · ${real(total)}`;
  } else {
    texto = `Olá, ${CONFIG.nome}! Vi a página de vocês e gostaria de mais informações.`;
    rotulo = "Chamar no WhatsApp";
  }
  $("botaoWhats").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`;
  $("botaoWhats").textContent = rotulo;
}

const mapa = CONFIG.mapa || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.endereco)}`;
$("contato").innerHTML = `
  <div>📍 ${esc(CONFIG.endereco)}</div>
  <div>🕒 ${esc(CONFIG.horarioTexto)}</div>
  <a href="${mapa}" target="_blank" rel="noopener">Abrir no mapa →</a>
  ${CONFIG.instagram ? `<a href="https://instagram.com/${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Instagram @${esc(CONFIG.instagram)} →</a>` : ""}`;

renderItens();
</script>
</body>
</html>
